<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anima</title>
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background-color: #f5f7fa;
      color: #333;
    }

    header {
      background: linear-gradient(135deg, #2e8b57, #66cdaa);
      color: white;
      padding: 1rem 0;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    header h1 {
      margin: 0;
      font-size: 2rem;
      letter-spacing: 1px;
    }

    nav {
      display: flex;
      justify-content: center;
      background: white;
      padding: 0.75rem;
      gap: 1rem;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    nav a {
      text-decoration: none;
      color: #2e8b57;
      padding: 0.5rem 1rem;
      border-radius: 25px;
      font-weight: 500;
      transition: all 0.3s ease;
    }

    nav a:hover {
      background-color: #2e8b57;
      color: white;
      transform: translateY(-2px);
    }

    nav a.active {
      background-color: #2e8b57;
      color: white;
      box-shadow: 0 2px 10px rgba(46, 139, 87, 0.3);
    }

    main {
      max-width: 900px;
      margin: 3rem auto;
      background: white;
      border-radius: 20px;
      padding: 2rem;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.05);
      text-align: center;
    }

    main h2 {
      color: #2e8b57;
      margin-bottom: 1rem;
    }

    footer {
      text-align: center;
      padding: 1rem;
      background: #2e8b57;
      color: white;
      margin-top: 3rem;
      border-top-left-radius: 20px;
      border-top-right-radius: 20px;
    }

  </style>
</head>
<body>
  <header>
    <h1>🌿 Anima</h1>
  </header>

  <nav>
    <a href="index.html" id="inicio">Inicio</a>
    <a href="informacion.html" id="info">Información</a>
    <a href="galeria.html" id="galeria">Galería</a>
    <a href="contacto.html" id="contacto">Contacto</a>
  </nav>

  <main>
    <h2>Bienvenida a Anima 🌱</h2>
    <p>Explora el fascinante mundo natural y descubre cómo cuidarlo.  
    Selecciona una sección del menú para comenzar tu recorrido 🌎✨.</p>
  </main>

  <footer>
    <p>© 2025 Anima. Todos los derechos reservados.</p>
  </footer>

  <script>
    // Detecta la página actual y marca el botón activo
    const current = window.location.pathname.split("/").pop();
    const links = document.querySelectorAll("nav a");
    links.forEach(link => {
      if (link.getAttribute("href") === current || (current === "" && link.getAttribute("href") === "index.html")) {
        link.classList.add("active");
      }
    });

    // Si inicia sin archivo (ej: dominio principal), redirige a index.html
    if (current === "") {
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
